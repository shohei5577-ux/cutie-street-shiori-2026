<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CUTIE STREET 東京遠征しおり</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --ink: #24303a;
      --muted: #65737d;
      --line: #ddd8d0;
      --paper: #fffaf4;
      --teal: #00737c;
      --coral: #cf5c45;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(160deg, rgba(0, 115, 124, .12), transparent 40%),
        linear-gradient(20deg, rgba(207, 92, 69, .14), transparent 42%),
        #f6f1ea;
    }

    main {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 28px 18px 36px;
    }

    .hero {
      padding: 26px 0 18px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--teal);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 56px);
      line-height: 1.03;
      letter-spacing: 0;
    }

    .lead {
      max-width: 620px;
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.75;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .card {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 250, 244, .88);
      text-decoration: none;
      color: inherit;
      box-shadow: 0 10px 24px rgba(45, 38, 30, .08);
    }

    .card strong {
      display: block;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .card span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .badge {
      align-self: flex-start;
      border-radius: 999px;
      padding: 5px 9px;
      background: #e8f3f2;
      color: var(--teal);
      font-size: 12px;
      font-weight: 800;
    }

    .card.primary {
      background: #fff;
      border-color: rgba(0, 115, 124, .3);
    }

    .card.sns .badge {
      background: #fdebe6;
      color: var(--coral);
    }

    .note {
      margin-top: 18px;
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .68);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 150px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">CUTIE STREET TOKYO TRIP</p>
      <h1>東京遠征しおり</h1>
      <p class="lead">6月の有明遠征と8月の日本武道館ライブ用に、既存しおり・SNS候補・保存グルメをまとめて見られる入口です。</p>
    </section>

    <section class="grid" aria-label="しおり一覧">
      <a class="card primary" href="cutie-street-tokyo-2026-06.html">
        <span class="badge">既存しおり</span>
        <div>
          <strong>6月 有明遠征しおり</strong>
          <span>日程、ホテル、みそきん池袋、原宿/表参道、秋葉原、移動メモをまとめた本編。</span>
        </div>
      </a>

      <a class="card sns" href="cutie-street-sns-spots-2026.html">
        <span class="badge">SNS候補</span>
        <div>
          <strong>東京スポット候補一覧</strong>
          <span>武道館・有明・原宿・池袋などの候補をフィルターで比較するページ。</span>
        </div>
      </a>

      <a class="card" href="tokyo-buzz-gourmet-recommendations.html">
        <span class="badge">保存グルメ</span>
        <div>
          <strong>東京バズグルメ保存版</strong>
          <span>既存しおりで採用した店を含む、グルメ候補の詳細ページ。</span>
        </div>
      </a>
    </section>

    <p class="note">友達に共有する時は、このトップページのURLを送れば3つのページに移動できます。</p>
  </main>
</body>
</html>
